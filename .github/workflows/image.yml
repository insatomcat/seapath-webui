# What buildpush.sh does on a laptop, on every push to main: build the image,
# check that it answers, publish it. The image is built and smoke tested while
# the tests run, and published only once both have passed, because an image
# that fails them is one an operator can pull.
#
# A pull request runs the tests alone. That is where they are worth the most,
# and the publish job holds the Docker Hub credentials, which a run triggered
# from a fork must never reach.

name: image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: insatomcat/seapath-webui
  # The branch of seapath/ansible the collection is built from. Two catalogue
  # entries live only there, and the Dockerfile carries the same default for a
  # build run by hand.
  SEAPATH_ANSIBLE_REF: seapathalloc

# The actions are pinned to a commit rather than to a tag. A tag is moved by
# whoever owns it, and these run in a job that later logs in to Docker Hub, so
# the commit is the only part of the reference that says which code ran. The
# comment after each one is the tag it was resolved from, which is what makes
# the next bump readable.
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check app tests

      - run: black --check app tests

      # `--cov` with no argument takes its source from pyproject.toml, branches
      # included. The json report feeds the step below.
      - run: pytest --cov --cov-report=term-missing --cov-report=json

      # coverage.py fails on the combined figure alone, and the two numbers
      # that answer for this suite are the statement one and the branch one,
      # so they are checked apart. Both floors sit above the OpenSSF Best
      # Practices thresholds, 80% of statements for silver and 80% of branches
      # for gold, so a slide is caught while the criteria still hold.
      - name: The coverage floors
        run: |
          python - <<'PY'
          import json, sys

          totals = json.load(open("coverage.json"))["totals"]
          floors = {
              "statements": (totals["covered_lines"], totals["num_statements"], 90.0),
              "branches": (totals["covered_branches"], totals["num_branches"], 80.0),
          }
          low = []
          for name, (covered, total, floor) in floors.items():
              reached = 100.0 * covered / total
              print(f"{name}: {reached:.2f}% of {total}, floor {floor:.0f}%")
              if reached < floor:
                  low.append(name)
          if low:
              sys.exit(f"below the floor: {', '.join(low)}")
          PY

  # Built while the tests run rather than after them, and published by the
  # job below only once both have passed. The layers go to the Actions cache:
  # `prepare.sh` of the collection takes over two minutes and gives the same
  # answer for as long as the branch it is built from stays on one commit.
  image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      collection_sha: ${{ steps.collection.outputs.sha }}
      collection_version: ${{ steps.collection.outputs.version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The collection version stamped into the image. `galaxy.yml` says 2.0.0
      # on every branch, so the branch and the commit it was built from are the
      # only part of this label that answers "which code is on the machines".
      # The service reports it next to the fingerprint it reads from disk.
      - name: Resolve the collection the image will carry
        id: collection
        run: |
          sha=$(git ls-remote https://github.com/seapath/ansible.git \
                  "refs/heads/${SEAPATH_ANSIBLE_REF}" | cut -f1)
          if [ -z "${sha}" ]; then
              echo "seapath/ansible has no branch ${SEAPATH_ANSIBLE_REF}" >&2
              exit 1
          fi
          echo "version=${SEAPATH_ANSIBLE_REF}@${sha:0:12}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      # The version the quadlet pins, read from the source rather than typed
      # here. `tests/test_packaging.py` holds the two together, so this is the
      # tag a machine deployed from this repository will ask for.
      - name: Resolve the image version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)
          if [ -z "${version}" ]; then
              echo "app/__init__.py carries no __version__" >&2
              exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # `mode=max` keeps the layers of the two build stages too, which is where
      # the collection is prepared; the default keeps the final stage alone.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:smoke
          build-args: |
            SEAPATH_ANSIBLE_REF=${{ env.SEAPATH_ANSIBLE_REF }}
            SEAPATH_ANSIBLE_COMMIT=${{ steps.collection.outputs.sha }}
            COLLECTION_VERSION=${{ steps.collection.outputs.version }}
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # One host mount and no TLS material, same as buildpush.sh: this only
      # proves the process starts and answers. The mount is the read only /etc
      # the quadlet gives the container, and the image symlinks /etc/passwd,
      # /etc/group and /etc/shadow into it, so without it the image would be
      # smoke tested in a state no deployment ever has.
      - name: Smoke test
        run: |
          container=$(docker run -d -p 18006:8006 \
              -v /etc:/run/host/etc:ro \
              -e SEAPATH_WEBUI_STATE_DIR=/tmp/state \
              -e SEAPATH_WEBUI_PORT=8006 \
              "${IMAGE}:smoke")
          for _ in $(seq 1 30); do
              if curl -ksf https://localhost:18006/healthz >/dev/null; then
                  break
              fi
              sleep 1
          done
          if ! curl -ksf https://localhost:18006/healthz; then
              echo "The image does not answer on /healthz" >&2
              docker logs "${container}" >&2
              docker rm -f "${container}" >/dev/null
              exit 1
          fi
          docker rm -f "${container}" >/dev/null

  # The only job holding the Docker Hub credentials, and the only one waiting
  # on the tests: an image that fails them is one an operator can pull. It
  # builds again with the same arguments, which the cache the job above just
  # filled answers layer for layer, so what is pushed is what was smoke tested.
  publish:
    needs: [tests, image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Three tags, and only one of them is a promise. The commit tag names
      # exactly this build. `latest` is what a first deployment pulls. The
      # version tag is what the quadlet pins, and it is published once: a tag
      # that moves says nothing about which code answers on a machine, which is
      # the whole reason the quadlet names one rather than `latest`.
      #
      # So a push to main that carries no bump of `__version__` publishes the
      # first two and says so. Shipping to a machine means bumping the version,
      # which is the release gesture docs/deployment.md describes.
      - name: Choose the tags
        id: tags
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          tags="${IMAGE}:${GITHUB_SHA:0:7}"$'\n'"${IMAGE}:latest"
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              echo "::notice::${IMAGE}:${VERSION} is already published and is \
          left as it is. Bump __version__ to publish a new version tag; this \
          build is ${IMAGE}:${GITHUB_SHA:0:7}."
          else
              tags="${tags}"$'\n'"${IMAGE}:${VERSION}"
          fi
          {
              echo "tags<<EOF"
              echo "${tags}"
              echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SEAPATH_ANSIBLE_REF=${{ env.SEAPATH_ANSIBLE_REF }}
            SEAPATH_ANSIBLE_COMMIT=${{ needs.image.outputs.collection_sha }}
            COLLECTION_VERSION=${{ needs.image.outputs.collection_version }}
            VERSION=${{ needs.image.outputs.version }}
          cache-from: type=gha

      # The Docker Hub page is the README, and a page that lags the image it
      # describes is worse than no page. `enable-url-completion` rewrites the
      # relative links to this repository, which Docker Hub resolves against
      # nothing: without it the screenshots and the links into `docs/` are
      # broken there. The push above is what gates this, so a build that never
      # published never advertises itself either.
      - name: Update the Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # The description API wants a token with the read, write and delete
          # scope. A push only token logs in and pushes, then fails here.
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: >-
            Management UI and REST API on every SEAPATH node: inventory,
            cluster join, Ansible runs
          enable-url-completion: true
