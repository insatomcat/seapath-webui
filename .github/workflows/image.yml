# What buildpush.sh does on a laptop, on every push to main: build the image,
# check that it answers, publish it. The tests run first, because an image that
# fails them is one an operator can pull.

name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: insatomcat/seapath-webui
  # The branch of seapath/ansible the collection is built from. Two catalogue
  # entries live only there, and the Dockerfile carries the same default for a
  # build run by hand.
  SEAPATH_ANSIBLE_REF: seapathalloc

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check app tests

      - run: black --check app tests

      - run: pytest

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The collection version stamped into the image. `galaxy.yml` says 2.0.0
      # on every branch, so the branch and the commit it was built from are the
      # only part of this label that answers "which code is on the machines".
      # The service reports it next to the fingerprint it reads from disk.
      - name: Resolve the collection the image will carry
        id: collection
        run: |
          sha=$(git ls-remote https://github.com/seapath/ansible.git \
                  "refs/heads/${SEAPATH_ANSIBLE_REF}" | cut -f1)
          if [ -z "${sha}" ]; then
              echo "seapath/ansible has no branch ${SEAPATH_ANSIBLE_REF}" >&2
              exit 1
          fi
          echo "version=${SEAPATH_ANSIBLE_REF}@${sha:0:12}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

      # The version the quadlet pins, read from the source rather than typed
      # here. `tests/test_packaging.py` holds the two together, so this is the
      # tag a machine deployed from this repository will ask for.
      - name: Resolve the image version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)
          if [ -z "${version}" ]; then
              echo "app/__init__.py carries no __version__" >&2
              exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build
        run: |
          docker build \
              --build-arg "SEAPATH_ANSIBLE_REF=${SEAPATH_ANSIBLE_REF}" \
              --build-arg "SEAPATH_ANSIBLE_COMMIT=${{ steps.collection.outputs.sha }}" \
              --build-arg "COLLECTION_VERSION=${{ steps.collection.outputs.version }}" \
              -t "${IMAGE}:${GITHUB_SHA:0:7}" \
              -t "${IMAGE}:${{ steps.version.outputs.version }}" \
              -t "${IMAGE}:latest" \
              .

      # One host mount and no TLS material, same as buildpush.sh: this only
      # proves the process starts and answers. The mount is the read only /etc
      # the quadlet gives the container, and the image symlinks /etc/passwd,
      # /etc/group and /etc/shadow into it, so without it the image would be
      # smoke tested in a state no deployment ever has.
      - name: Smoke test
        run: |
          container=$(docker run -d -p 18006:8006 \
              -v /etc:/run/host/etc:ro \
              -e SEAPATH_WEBUI_STATE_DIR=/tmp/state \
              -e SEAPATH_WEBUI_PORT=8006 \
              "${IMAGE}:${GITHUB_SHA:0:7}")
          for _ in $(seq 1 30); do
              if curl -ksf https://localhost:18006/healthz >/dev/null; then
                  break
              fi
              sleep 1
          done
          if ! curl -ksf https://localhost:18006/healthz; then
              echo "The image does not answer on /healthz" >&2
              docker logs "${container}" >&2
              docker rm -f "${container}" >/dev/null
              exit 1
          fi
          docker rm -f "${container}" >/dev/null

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Three tags, and only one of them is a promise. The commit tag names
      # exactly this build. `latest` is what a first deployment pulls. The
      # version tag is what the quadlet pins, and it is published once: a tag
      # that moves says nothing about which code answers on a machine, which is
      # the whole reason the quadlet names one rather than `latest`.
      #
      # So a push to main that carries no bump of `__version__` publishes the
      # first two and says so. Shipping to a machine means bumping the version,
      # which is the release gesture docs/deployment.md describes.
      - name: Push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push "${IMAGE}:${GITHUB_SHA:0:7}"
          docker push "${IMAGE}:latest"
          if docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              echo "::notice::${IMAGE}:${VERSION} is already published and is \
          left as it is. Bump __version__ to publish a new version tag; this \
          build is ${IMAGE}:${GITHUB_SHA:0:7}."
          else
              docker push "${IMAGE}:${VERSION}"
          fi
