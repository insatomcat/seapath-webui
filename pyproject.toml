# Tool configuration only. The service is not installed as a package: the image
# copies `app/` and runs `python -m app`, which keeps the runtime layout
# identical to the source tree.

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

# Coverage is measured over `app/`, branches included, because the branch
# figure is the one that says whether the failure paths are exercised at all.
# The workflow checks the two floors that matter and prints them; this number
# is the combined figure coverage.py prints, and it is here so that a local
# `pytest --cov` fails the same way CI does.
[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 88
